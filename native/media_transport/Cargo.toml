[package]
name = "curie-media-transport"
version = "0.1.0"
edition = "2021"
description = "Bounded native audio and attachment transport for Curie"
license = "MIT"
publish = false

[lib]
name = "_curie_media_transport"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
sha2 = "0.10.9"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
