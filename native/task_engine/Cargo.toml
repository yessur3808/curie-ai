[package]
name = "curie-task-engine"
version = "0.1.0"
edition = "2021"
description = "Durable task, lease, and idempotency engine for Curie"
license = "MIT"
publish = false

[lib]
name = "_curie_task_engine"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
# Share the host SQLite library with Python and the runtime kernel. Loading
# multiple bundled SQLite copies in one process makes WAL locking unsafe.
rusqlite = "0.37.0"
serde_json = "1.0.145"
sha2 = "0.10.9"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
