[package]
name = "curie-connector-gateway"
version = "0.1.0"
edition = "2021"
description = "Bounded native connector queue and delivery state kernel for Curie"
license = "MIT"
publish = false

[lib]
name = "_curie_connector_gateway"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
