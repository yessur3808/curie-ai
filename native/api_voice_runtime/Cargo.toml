[package]
name = "curie-api-voice-runtime"
version = "0.1.0"
edition = "2021"
description = "Native API coordination, live voice sessions, recognition, and trained speech runtime for Curie"
license = "MIT"
publish = false

[lib]
name = "_curie_api_voice_runtime"
crate-type = ["cdylib"]

[dependencies]
fs2 = "0.4.3"
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
regex = "1.12.2"
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
