name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  static-analysis:
    name: Static analysis (flake8)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: pip install flake8==7.2.0

      - name: Run flake8
        # Flake8 settings are read from .flake8 in the repo root.
        run: |
          flake8 agent/ connectors/ llm/ memory/ services/ utils/ main.py tests/ \
            --exclude=__pycache__,migrations

  format-check:
    name: Format check (black)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install black
        run: pip install black==25.1.0

      - name: Check formatting
        run: black --check agent/ connectors/ llm/ memory/ services/ utils/ main.py tests/

  unit-tests:
    name: Offline unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core dependencies
        # Install only the lightweight subset needed for the unit tests.
        # Heavy optional packages (llama-cpp-python, discord.py, etc.) are
        # mocked inside the test suite and are not required here.
        run: |
          pip install \
            pytest \
            pytest-asyncio \
            pytest-cov \
            python-dotenv \
            pytz \
            fastapi \
            pydantic \
            psycopg2-binary \
            pymongo \
            httpx \
            gitpython \
            beautifulsoup4 \
            PyGithub \
            python-multipart==0.0.22

      - name: Run the deterministic offline suite in one process
        run: pytest -q

  integration-tests:
    name: Local integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install integration dependencies
        run: pip install pytest pytest-asyncio python-dotenv pytz fastapi pydantic psycopg2-binary pymongo httpx gitpython beautifulsoup4 PyGithub python-multipart==0.0.22
      - name: Run local component boundaries
        run: pytest -q -m integration

  security-tests:
    name: Security invariants and targeted coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install security test dependencies
        run: pip install pytest pytest-asyncio pytest-cov python-dotenv pytz fastapi pydantic psycopg2-binary pymongo httpx gitpython beautifulsoup4 PyGithub python-multipart==0.0.22
      - name: Verify permissions, path safety, audit isolation, and tool schemas
        run: >-
          pytest -q -m security
          --cov=agent.action_router
          --cov=agent.tooling
          --cov=memory.local_store
          --cov-report=term-missing
          --cov-fail-under=65

  security-scans:
    name: Dependency, static, and secret scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scanners
        run: pip install pip-audit bandit detect-secrets
      - name: Audit pinned dependencies
        run: pip-audit -r requirements.txt
      - name: Scan Python for high-severity findings
        run: bandit -q -r agent connectors llm memory services utils -lll
      - name: Scan tracked files for likely secrets
        run: >-
          git ls-files -z | xargs -0 detect-secrets-hook
          --exclude-files '(\.env\.example|tests/fixtures/)'

  deterministic-evaluation:
    name: Deterministic response evaluation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        run: pip install pytest pytest-asyncio python-dotenv fastapi pydantic httpx
      - name: Run deterministic quality gates
        run: |
          pytest -q tests/test_evaluation_runner.py
          python -m evaluation.phase2_suite
          python -m evaluation.phase345_suite

  release-contracts:
    name: Contracts, migrations, and release evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install contract-test dependencies
        run: pip install pytest pytest-asyncio python-dotenv fastapi pydantic psycopg2-binary pymongo httpx gitpython beautifulsoup4 PyGithub python-multipart==0.0.22
      - name: Validate release evidence
        run: python -m scripts.check_release
      - name: Run public contract and migration conformance
        run: pytest -q tests/test_phase10_extensibility.py tests/test_connector_lifecycle.py tests/test_media_ingestion.py tests/test_tooling_registry.py
