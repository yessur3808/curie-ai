name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis (flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: pip install flake8==7.2.0

      - name: Run flake8
        # Flake8 settings are read from .flake8 in the repo root.
        run: |
          flake8 agent/ connectors/ contracts/ evaluation/ llm/ memory/ scripts/ \
            services/ utils/ main.py tests/ \
            --exclude=__pycache__,migrations

  format-check:
    name: Format check (black)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install black
        run: pip install black==26.5.1

      - name: Check formatting
        run: >-
          black --check agent/ connectors/ contracts/ evaluation/ llm/ memory/
          scripts/ services/ utils/ main.py tests/

  rust-memory-kernel:
    name: Rust memory kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python and native build dependencies
        run: pip install -r requirements-ci.txt -r requirements-rust.txt
      - name: Verify the runner Rust toolchain
        run: rustc --version && cargo --version
      - name: Check Rust formatting, lints, and unit tests
        run: |
          cargo fmt --manifest-path native/memory_kernel/Cargo.toml -- --check
          cargo clippy --manifest-path native/memory_kernel/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path native/memory_kernel/Cargo.toml
      - name: Build and install the ABI3 extension
        run: |
          maturin build --release --locked --out dist/native \
            --manifest-path native/memory_kernel/Cargo.toml
          pip install dist/native/curie_memory_kernel-*.whl
      - name: Require native parity, isolation, and integration
        env:
          CURIE_MEMORY_KERNEL: rust
        run: >-
          pytest -q tests/test_memory_kernel_native.py
          tests/test_hierarchical_memory.py
          tests/test_phase67_response_memory.py
      - name: Run a bounded native benchmark smoke test
        env:
          CURIE_MEMORY_KERNEL: rust
        run: python -m scripts.benchmark_memory_kernel --sizes 250 --iterations 1 --mode rust

  unit-tests:
    name: Offline unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core dependencies
        # Install only the lightweight subset needed for the unit tests.
        # Heavy optional packages (llama-cpp-python, discord.py, etc.) are
        # mocked inside the test suite and are not required here.
        run: pip install -r requirements-ci.txt

      - name: Run the deterministic offline suite in one process
        run: pytest -q

  integration-tests:
    name: Local integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install integration dependencies
        run: pip install -r requirements-ci.txt
      - name: Run local component boundaries
        run: pytest -q -m integration

  security-tests:
    name: Security invariants and targeted coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install security test dependencies
        run: pip install -r requirements-ci.txt
      - name: Verify permissions, path safety, audit isolation, and tool schemas
        run: >-
          pytest -q -m security
          --cov=agent.action_router
          --cov=agent.tooling
          --cov=memory.local_store
          --cov-report=term-missing
          --cov-fail-under=65

  security-scans:
    name: Dependency, static, and secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scanners
        run: pip install pip-audit bandit detect-secrets==1.5.0
      - name: Audit pinned dependencies
        # diskcache is pulled by llama-cpp-python. 5.6.3 is the latest release
        # and PYSEC-2026-2447 has no fixed version; see docs/security.md.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-2447
      - name: Audit pinned Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file native/memory_kernel/Cargo.lock
      - name: Scan Python for high-severity findings
        run: >-
          bandit -q -r agent connectors evaluation llm memory scripts services utils
          -lll
      - name: Scan tracked files for likely secrets
        run: >-
          git ls-files -z | xargs -0 detect-secrets-hook
          --baseline .secrets.baseline
          --exclude-files '(\.env\.example|tests/fixtures/)'

  deterministic-evaluation:
    name: Deterministic response evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        run: pip install -r requirements-ci.txt
      - name: Run deterministic quality gates
        run: |
          pytest -q tests/test_evaluation_runner.py
          python -m evaluation.release --skip-tests --report evaluation/reports/ci.json
      - name: Verify generated evidence contains no credential shapes
        run: python scripts/scan_runtime_artifacts.py evaluation/reports/ci.json
      - name: Upload redacted release evidence
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-release-evidence
          path: evaluation/reports/ci.json
          retention-days: 14

  release-contracts:
    name: Contracts, migrations, and release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install contract-test dependencies
        run: pip install -r requirements-ci.txt
      - name: Validate release evidence
        run: python -m scripts.check_release
      - name: Run public contract and migration conformance
        run: pytest -q tests/test_phase10_extensibility.py tests/test_connector_lifecycle.py tests/test_media_ingestion.py tests/test_tooling_registry.py

  release-ready:
    name: Release readiness
    if: always()
    needs:
      - static-analysis
      - format-check
      - rust-memory-kernel
      - unit-tests
      - integration-tests
      - security-tests
      - security-scans
      - deterministic-evaluation
      - release-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every independent lane to pass
        env:
          STATIC_ANALYSIS: ${{ needs.static-analysis.result }}
          FORMAT_CHECK: ${{ needs.format-check.result }}
          RUST_MEMORY_KERNEL: ${{ needs.rust-memory-kernel.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          INTEGRATION_TESTS: ${{ needs.integration-tests.result }}
          SECURITY_TESTS: ${{ needs.security-tests.result }}
          SECURITY_SCANS: ${{ needs.security-scans.result }}
          DETERMINISTIC_EVALUATION: ${{ needs.deterministic-evaluation.result }}
          RELEASE_CONTRACTS: ${{ needs.release-contracts.result }}
        run: |
          for result in \
            "$STATIC_ANALYSIS" \
            "$FORMAT_CHECK" \
            "$RUST_MEMORY_KERNEL" \
            "$UNIT_TESTS" \
            "$INTEGRATION_TESTS" \
            "$SECURITY_TESTS" \
            "$SECURITY_SCANS" \
            "$DETERMINISTIC_EVALUATION" \
            "$RELEASE_CONTRACTS"
          do
            test "$result" = "success"
          done
